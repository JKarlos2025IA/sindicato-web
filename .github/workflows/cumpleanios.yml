name: Cumpleaños Diario

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 06:00 AM Lima (UTC-5)
    - cron: "25 11 * * *"  # 11:25 UTC = 06:25 AM Lima (respaldo interno)
  workflow_dispatch:  # permite ejecutar manualmente

jobs:
  enviar-cumpleanios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install firebase-admin requests

      - name: Ejecutar script de cumpleaños
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cumpleanios_github.py
