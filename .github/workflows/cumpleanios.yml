name: Cumpleaños Diario

on:
  schedule:
    - cron: "13 8 * * *"  # 8:13 AM Peru (UTC-5) = 13:13 UTC
  workflow_dispatch:  # permite ejecutar manualmente

jobs:
  enviar-cumpleanios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install firebase-admin requests

      - name: Ejecutar script de cumpleaños
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cumpleanios_github.py
