<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 500px;
    overflow: hidden;
    font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
    background: linear-gradient(160deg, #0a1628 0%, #0f2040 40%, #1a2744 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .grid-bg {
    position: absolute; inset: 0; opacity: .05;
    background-image:
      linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  .glow {
    position: absolute; border-radius: 50%; pointer-events: none;
  }
  .glow-1 { width: 550px; height: 550px; top: -250px; left: -150px; background: radial-gradient(circle, rgba(34,197,94,.12) 0%, transparent 70%); }
  .glow-2 { width: 450px; height: 450px; bottom: -180px; right: -100px; background: radial-gradient(circle, rgba(37,99,235,.15) 0%, transparent 70%); }
  .glow-3 { width: 300px; height: 300px; top: 30%; right: 20%; background: radial-gradient(circle, rgba(249,115,22,.08) 0%, transparent 60%); }

  .bar-top {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #22c55e, #4ade80, #22c55e);
  }
  .bar-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1e3a8a, #2563eb, #1e3a8a);
  }

  .main {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 70px;
    width: 100%; padding: 0 90px;
  }

  /* Logo */
  .logo-col {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .logo-ring {
    width: 170px; height: 170px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 5px rgba(34,197,94,.25),
      0 0 0 12px rgba(34,197,94,.08),
      0 20px 50px rgba(0,0,0,.5);
  }
  .logo-ring img {
    width: 140px; height: 140px; border-radius: 50%; object-fit: contain;
  }
  .brand-name {
    font-size: 16px; font-weight: 900; letter-spacing: 8px;
    color: #4ade80; text-transform: uppercase;
  }

  /* Texto */
  .text-col {
    flex: 1; display: flex; flex-direction: column; gap: 20px;
  }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(34,197,94,.10);
    border: 1.5px solid rgba(34,197,94,.35);
    color: #4ade80;
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    padding: 8px 20px; border-radius: 50px;
    text-transform: uppercase; width: fit-content;
  }
  .tag::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 8px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .title {
    font-size: 48px; font-weight: 900; color: #ffffff;
    line-height: 1.1; letter-spacing: -1px;
  }
  .title .green {
    background: linear-gradient(135deg, #22c55e 0%, #4ade80 50%, #a3e635 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .desc {
    font-size: 18px; color: #94a3b8; line-height: 1.5; max-width: 540px;
  }

  .contact {
    display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(34,197,94,.25);
    border-radius: 16px; padding: 16px 26px;
    width: fit-content;
  }
  .contact .icon-circle {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(34,197,94,.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .contact .info { line-height: 1.3; }
  .contact .info .rol {
    font-size: 11px; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .contact .info .phone {
    font-size: 30px; font-weight: 800; color: #4ade80; letter-spacing: 2px;
  }

  .watermark {
    position: absolute; bottom: 16px; right: 50px; z-index: 2;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,.12); letter-spacing: 3px;
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>
<div class="bar-top"></div>
<div class="bar-bottom"></div>

<div class="main">
  <div class="logo-col">
    <div class="logo-ring">
      <img src="../../_recursos/logo.png" alt="SIUTCASJNJ" />
    </div>
    <div class="brand-name">SIUTCASJNJ</div>
  </div>

  <div class="text-col">
    <div class="tag">Inscripciones Abiertas</div>

    <div class="title">
      Sumate al<br><span class="green">sindicato</span>
    </div>

    <div class="desc">
      Une fuerzas con tus companeros. Juntos defendemos
      nuestros derechos y construimos un mejor ambiente laboral.
    </div>
  </div>
</div>

<div class="watermark">GESTION 2026 — 2028</div>

</body>
</html>
