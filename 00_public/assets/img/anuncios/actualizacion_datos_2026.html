<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 500px;
    overflow: hidden;
    font-family: 'Segoe UI', 'Inter', Arial, sans-serif;
    background: #060e1f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Fondo con grid sutil */
  .grid-bg {
    position: absolute; inset: 0; opacity: .06;
    background-image:
      linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
    background-size: 50px 50px;
  }

  /* Gradientes de glow */
  .glow {
    position: absolute; border-radius: 50%; pointer-events: none;
  }
  .glow-1 { width: 500px; height: 500px; top: -200px; left: -100px; background: radial-gradient(circle, rgba(37,99,235,.18) 0%, transparent 70%); }
  .glow-2 { width: 400px; height: 400px; bottom: -150px; right: -80px; background: radial-gradient(circle, rgba(249,115,22,.10) 0%, transparent 70%); }
  .glow-3 { width: 350px; height: 350px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(201,168,76,.06) 0%, transparent 60%); }

  /* Barras */
  .bar-top {
    position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #c9a84c 0%, #e5c76b 30%, #c9a84c 50%, #e5c76b 70%, #c9a84c 100%);
  }
  .bar-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #1e3a8a, #2563eb, #1e3a8a);
  }

  /* Contenedor principal */
  .main {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 70px;
    width: 100%; padding: 0 90px;
  }

  /* --- COLUMNA IZQUIERDA: Logo --- */
  .logo-col {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }

  .logo-ring {
    width: 170px; height: 170px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 5px rgba(201,168,76,.25),
      0 0 0 12px rgba(201,168,76,.08),
      0 20px 50px rgba(0,0,0,.5),
      inset 0 0 0 1px rgba(255,255,255,.8);
    position: relative;
  }
  .logo-ring img {
    width: 140px; height: 140px; border-radius: 50%; object-fit: contain;
  }

  .brand-name {
    font-size: 16px; font-weight: 900; letter-spacing: 8px;
    color: #c9a84c; text-transform: uppercase;
  }

  /* --- COLUMNA DERECHA: Texto --- */
  .text-col {
    flex: 1; display: flex; flex-direction: column; gap: 20px;
  }

  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(249,115,22,.10);
    border: 1.5px solid rgba(249,115,22,.3);
    color: #fb923c;
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    padding: 8px 20px; border-radius: 50px;
    text-transform: uppercase; width: fit-content;
  }
  .tag::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #f97316; box-shadow: 0 0 8px #f97316;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .4; }
  }

  .title {
    font-size: 48px; font-weight: 900; color: #ffffff;
    line-height: 1.1; letter-spacing: -1px;
  }
  .title .orange {
    background: linear-gradient(135deg, #f97316 0%, #fb923c 50%, #fbbf24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .desc {
    font-size: 18px; color: #94a3b8; line-height: 1.5; max-width: 550px;
  }

  /* Tarjeta de contacto */
  .contact {
    display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(201,168,76,.25);
    border-radius: 16px; padding: 16px 26px;
    width: fit-content;
    backdrop-filter: blur(4px);
  }
  .contact .icon-circle {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(201,168,76,.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .contact .info { line-height: 1.3; }
  .contact .info .rol {
    font-size: 11px; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .contact .info .phone {
    font-size: 30px; font-weight: 800; color: #e5c76b; letter-spacing: 2px;
  }

  /* Watermark */
  .watermark {
    position: absolute; bottom: 16px; right: 50px; z-index: 2;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,.15); letter-spacing: 3px;
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>
<div class="bar-top"></div>
<div class="bar-bottom"></div>

<div class="main">
  <!-- LOGO -->
  <div class="logo-col">
    <div class="logo-ring">
      <img src="../../_recursos/logo.png" alt="SIUTCASJNJ" />
    </div>
    <div class="brand-name">SIUTCASJNJ</div>
  </div>

  <!-- TEXTO -->
  <div class="text-col">
    <div class="tag">Circular 001-2026</div>

    <div class="title">
      Actualiza tus<br><span class="orange">datos personales</span>
    </div>

    <div class="desc">
      Comun&iacute;cate con el Secretario de Organizaci&oacute;n
      para obtener tu c&oacute;digo de acceso y mantener tus datos al d&iacute;a.
    </div>

    <div class="contact">
      <div class="icon-circle">&#9742;</div>
      <div class="info">
        <div class="rol">Secretar&iacute;a de Organizaci&oacute;n</div>
        <div class="phone">996 200 200</div>
      </div>
    </div>
  </div>
</div>

<div class="watermark">GESTI&Oacute;N 2026 — 2028</div>

</body>
</html>
