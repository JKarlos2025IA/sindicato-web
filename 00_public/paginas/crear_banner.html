<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Creador de Banners — SIUTCASJNJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <h2 class="text-2xl font-black text-blue-900 mb-1">Creador de Banners</h2>
            <p class="text-gray-500 text-sm mb-6">Diseña banners para el carrusel. Elige tema, escribe texto, descarga y súbelo.</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tema</label>
                    <select id="tema-select" class="w-full border border-gray-300 rounded-lg p-3 focus:border-blue-500 outline-none">
                        <option value="institucional">Institucional (azul/blanco)</option>
                        <option value="navidad">Navidad (rojo/verde)</option>
                        <option value="fiestas">Fiestas Patrias (rojo/blanco)</option>
                        <option value="verano">Verano (celeste/amarillo)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Título principal</label>
                    <input type="text" id="texto-titulo" value="SIUTCASJNJ" maxlength="40"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:border-blue-500 outline-none font-bold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Subtítulo</label>
                    <input type="text" id="texto-sub" value="Sindicato Único de Trabajadores CAS" maxlength="50"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Texto inferior</label>
                    <input type="text" id="texto-bajo" value="Junta Nacional de Justicia • Gestión 2026-2028" maxlength="60"
                        class="w-full border border-gray-300 rounded-lg p-3 focus:border-blue-500 outline-none">
                </div>
                <button id="btn-generar" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all">
                    Generar Banner
                </button>
            </div>
        </div>

        <div id="resultado" class="hidden bg-white rounded-2xl shadow-xl p-6 text-center">
            <h3 class="font-bold text-gray-700 mb-3">Tu banner — clic derecho → Guardar imagen</h3>
            <canvas id="canvas" width="1200" height="500" class="w-full rounded-xl shadow-md border border-gray-200"></canvas>
            <div class="mt-4 flex gap-3 justify-center">
                <button id="btn-descargar" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition-all">
                    📥 Descargar PNG
                </button>
                <button id="btn-nuevo" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg transition-all">
                    Nuevo
                </button>
            </div>
        </div>
    </div>

    <script>
        const temas = {
            institucional: { bg: '#ffffff', titulo: '#0f2a5a', sub: '#4a5568', bajo: '#718096', linea: '#ea580c', franja: '#ea580c', top: '#0f2a5a' },
            navidad: { bg: '#ffffff', titulo: '#b91c1c', sub: '#166534', bajo: '#4a5568', linea: '#16a34a', franja: '#dc2626', top: '#b91c1c' },
            fiestas: { bg: '#ffffff', titulo: '#dc2626', sub: '#4a5568', bajo: '#4a5568', linea: '#dc2626', franja: '#dc2626', top: '#dc2626' },
            verano: { bg: '#fff7ed', titulo: '#0284c7', sub: '#4a5568', bajo: '#78350f', linea: '#f59e0b', franja: '#f59e0b', top: '#0284c7' }
        };

        function draw() {
            const t = temas[document.getElementById('tema-select').value];
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, 1200, 500);

            // Franja superior
            ctx.fillStyle = t.top;
            ctx.fillRect(0, 0, 1200, 6);

            // Franja inferior
            ctx.fillStyle = t.franja;
            ctx.fillRect(0, 480, 1200, 20);

            // Borde izquierdo
            ctx.fillStyle = t.top;
            ctx.fillRect(0, 0, 3, 500);

            // Logo placeholder (círculo)
            ctx.beginPath();
            ctx.arc(110, 250, 58, 0, Math.PI * 2);
            ctx.fillStyle = t.titulo;
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('S', 112, 268);

            // Círculo exterior
            ctx.beginPath();
            ctx.arc(110, 250, 60, 0, Math.PI * 2);
            ctx.strokeStyle = t.franja;
            ctx.lineWidth = 4;
            ctx.stroke();

            // Línea vertical
            ctx.fillStyle = t.franja;
            ctx.fillRect(200, 130, 3, 240);

            // Título
            ctx.fillStyle = t.titulo;
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(document.getElementById('texto-titulo').value, 230, 180);

            // Subtítulo
            ctx.fillStyle = t.sub;
            ctx.font = '26px Arial';
            ctx.fillText(document.getElementById('texto-sub').value, 230, 230);

            // Bajo
            ctx.fillStyle = t.bajo;
            ctx.font = '18px Arial';
            ctx.fillText(document.getElementById('texto-bajo').value, 230, 270);

            // Línea decorativa
            const grad = ctx.createLinearGradient(230, 0, 900, 0);
            grad.addColorStop(0, t.franja);
            grad.addColorStop(1, t.bg);
            ctx.fillStyle = grad;
            ctx.fillRect(230, 300, 670, 4);

            // Eslogan
            ctx.fillStyle = t.sub;
            ctx.font = '18px Arial';
            ctx.fillText('Unidad y compromiso por nuestros derechos.', 230, 340);

            document.getElementById('resultado').classList.remove('hidden');
        }

        document.getElementById('btn-generar').addEventListener('click', draw);

        document.getElementById('btn-descargar').addEventListener('click', () => {
            const tema = document.getElementById('tema-select').value;
            const a = document.createElement('a');
            a.href = document.getElementById('canvas').toDataURL('image/png');
            a.download = `banner_${tema}.png`;
            a.click();
        });

        document.getElementById('btn-nuevo').addEventListener('click', () => {
            document.getElementById('resultado').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        draw();
    </script>
</body>
</html>
