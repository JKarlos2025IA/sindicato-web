        <div class="space-y-3">

        ];

        document.getElementById('btn-sec').addEventListener('click', async () => {
            const btn = document.getElementById('btn-sec');
            btn.disabled = true; btn.textContent = 'Procesando...';
            log.innerHTML = '';
            L('Eliminando secretarías existentes...');
            const q = await getDocs(collection(db, "secretarias"));
            let n = 0;
            for (const d of q.docs) { await deleteDoc(doc(db, "secretarias", d.id)); n++; }
            L('Eliminadas: ' + n);
            L('Cargando 10 secretarías oficiales...');
            const batch = writeBatch(db);
            secretariasDefault.forEach((sec, i) => {
                const ref = doc(collection(db, "secretarias"));
                batch.set(ref, { ...sec, timestamp: Date.now() + i });
            });
            await batch.commit();
            L('OK - 10 secretarías restauradas sin duplicados.');
            btn.disabled = false; btn.textContent = '1. Corregir Secretarías (elimina duplicados)';
        });

        });

</body>
</html>
